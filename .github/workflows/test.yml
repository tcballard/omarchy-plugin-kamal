name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./tests/run
      - run: python -m pip install PySide6==6.11.2
      - name: QML load and panel lifecycle (host stubs, not live Omarchy)
        run: python tests/render_qml.py --check-only
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
